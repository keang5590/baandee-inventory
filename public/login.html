<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>เข้าสู่ระบบ | บ้านดี</title>
<link rel="stylesheet" href="style.css" />
</head>
<body class="login-body">

<div class="login-wrap">
  <div class="login-box">
    <div class="login-brand">
      <div class="brand-logo">🏠</div>
      <div>
        <div class="login-title">บ้านดี</div>
        <div class="login-subtitle">ระบบคลังอุปกรณ์ออกบูธ</div>
      </div>
    </div>

    <h1 class="login-heading">เข้าสู่ระบบ</h1>

    <form id="loginForm">
      <label for="loginUsername">ชื่อผู้ใช้</label>
      <input type="text" id="loginUsername" autocomplete="username" required autofocus />

      <label for="loginPassword">รหัสผ่าน</label>
      <input type="password" id="loginPassword" autocomplete="current-password" required />

      <div class="login-error hidden" id="loginError"></div>

      <button type="submit" class="btn-primary login-submit" id="loginSubmitBtn">เข้าสู่ระบบ</button>
    </form>
  </div>
</div>

<script>
const form = document.getElementById('loginForm');
const errorBox = document.getElementById('loginError');
const submitBtn = document.getElementById('loginSubmitBtn');

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  errorBox.classList.add('hidden');
  submitBtn.disabled = true;
  submitBtn.textContent = 'กำลังเข้าสู่ระบบ...';

  const username = document.getElementById('loginUsername').value.trim();
  const password = document.getElementById('loginPassword').value;

  try {
    const res = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password }),
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || 'เข้าสู่ระบบไม่สำเร็จ');
    window.location.href = '/';
  } catch (err) {
    errorBox.textContent = err.message;
    errorBox.classList.remove('hidden');
    submitBtn.disabled = false;
    submitBtn.textContent = 'เข้าสู่ระบบ';
  }
});
</script>

</body>
</html>
